name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Comparación de enfoques (línea base)
        run: python -m experiments.comparar --salida reportes/comparacion_ci.md
